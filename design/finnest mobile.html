<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>finnest - mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #1a1a1a; font-family: "IBM Plex Sans", system-ui, sans-serif; color: #fff; }
  button { font-family: inherit; cursor: pointer; }

  @keyframes mPulse {
    0%, 100% { opacity: 0.35; transform: scale(0.85); }
    50%      { opacity: 1;    transform: scale(1.1); }
  }
  @keyframes mBurst {
    0%   { transform: translate(-50%, -50%) translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) translate(var(--dx), var(--dy)) scale(0.4); opacity: 0; }
  }
  @keyframes mRing {
    0%   { width: 40px;  height: 40px;  opacity: 0.9; }
    100% { width: 220px; height: 220px; opacity: 0; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel" src="m-data.jsx"></script>
<script type="text/babel" src="m-shared.jsx"></script>
<script type="text/babel" src="m-web.jsx"></script>

<script type="text/babel">
const { MWLanding, MWWordlist, MWReview } = window;

function App() {
  return (
    <DesignCanvas>
      <DCSection id="web" title="Mobile Web" subtitle="Responsive web app served from finnest.app - native apps are a later milestone">
        <DCArtboard id="mw-landing"  label="Landing - paste"     width={400} height={820}><MWLanding /></DCArtboard>
        <DCArtboard id="mw-wordlist" label="Word list - parsed"  width={400} height={820}><MWWordlist /></DCArtboard>
        <DCArtboard id="mw-review"   label="Review - swipe"      width={400} height={820}><MWReview /></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
