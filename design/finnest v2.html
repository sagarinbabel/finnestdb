<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>finnest — parse Finnish & Estonian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
  :root {
    /* INK theme — bold dark default */
    --bg:        oklch(0.165 0.008 250);
    --bg-deep:   oklch(0.125 0.008 250);
    --bg-raise:  oklch(0.21 0.008 250);
    --bg-hover:  oklch(0.25 0.010 250);
    --line:      oklch(0.30 0.010 250);
    --line-soft: oklch(0.24 0.008 250);
    --ink:       oklch(0.96 0.005 90);
    --ink-soft:  oklch(0.78 0.008 90);
    --ink-mute:  oklch(0.55 0.010 90);

    --accent:    oklch(0.72 0.19 38);   /* hot vermillion — single accent */
    --known:     oklch(0.78 0.13 145);
    --learning:  oklch(0.80 0.14 85);
    --new:       oklch(0.72 0.19 38);

    --fi: oklch(0.78 0.13 200);
    --et: oklch(0.74 0.16 320);

    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --font-sans: "IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    --font-disp: "Fraunces", "Times New Roman", serif;

    --r-sm: 2px;
    --r-md: 4px;
    --r-lg: 8px;

    --topbar: 56px;
  }

  [data-theme="paper"] {
    --bg:        oklch(0.97 0.005 85);
    --bg-deep:   oklch(0.94 0.005 85);
    --bg-raise:  oklch(1 0 0);
    --bg-hover:  oklch(0.92 0.005 85);
    --line:      oklch(0.82 0.008 85);
    --line-soft: oklch(0.88 0.005 85);
    --ink:       oklch(0.18 0.008 250);
    --ink-soft:  oklch(0.40 0.010 250);
    --ink-mute:  oklch(0.58 0.010 250);
    --accent:    oklch(0.55 0.19 35);
    --known:     oklch(0.55 0.13 145);
    --learning:  oklch(0.62 0.14 80);
    --new:       oklch(0.55 0.19 35);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: "ss01", "cv11";
  }

  body { overflow: hidden; }

  ::selection { background: var(--accent); color: var(--bg-deep); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--line-soft); }

  .mono { font-family: var(--font-mono); font-feature-settings: "ss01"; }
  .num  { font-variant-numeric: tabular-nums; }
  .disp { font-family: var(--font-disp); }

  /* ─── App shell — single column, thin top nav ─── */
  .shell {
    display: grid;
    grid-template-rows: var(--topbar) 1fr;
    height: 100vh;
    width: 100vw;
  }

  .topbar {
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 24px;
    background: var(--bg);
    position: relative;
    z-index: 10;
  }
  .brand {
    font-family: var(--font-disp);
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--ink);
    cursor: pointer;
  }
  .brand .dot { color: var(--accent); }
  .topnav { display: flex; gap: 2px; }
  .topnav button {
    all: unset;
    cursor: pointer;
    padding: 8px 14px;
    font-size: 13px;
    color: var(--ink-mute);
    border-radius: var(--r-md);
    transition: color 0.08s, background 0.08s;
    position: relative;
  }
  .topnav button:hover { color: var(--ink); }
  .topnav button.active { color: var(--ink); }
  .topnav button.active::after {
    content: "";
    position: absolute;
    left: 14px; right: 14px; bottom: -1px;
    height: 2px; background: var(--accent);
  }
  .topnav .badge {
    margin-left: 6px;
    font-family: var(--font-mono);
    font-size: 10px;
    background: var(--accent);
    color: var(--bg-deep);
    padding: 0 5px;
    border-radius: 8px;
    font-weight: 600;
    vertical-align: 1px;
  }

  .topbar-spacer { flex: 1; }
  .topbar-stats {
    display: flex;
    gap: 18px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-mute);
  }
  .topbar-stats b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
  .topbar-stats .pos { color: var(--known); }

  .icon-btn {
    all: unset;
    width: 32px; height: 32px;
    display: grid; place-items: center;
    border-radius: var(--r-md);
    color: var(--ink-mute);
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--bg-raise); color: var(--ink); }

  .avatar-btn {
    all: unset;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    padding: 4px 6px 4px 4px;
    border-radius: 999px;
    border: 1px solid var(--line);
  }
  .avatar-btn:hover { border-color: var(--ink-mute); }
  .avatar-btn .av {
    width: 24px; height: 24px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--learning));
    color: var(--bg-deep);
    display: grid; place-items: center;
    font-weight: 700; font-size: 11px;
    font-family: var(--font-mono);
  }
  .avatar-btn .name { font-size: 12.5px; color: var(--ink-soft); padding-right: 6px; }

  .signin {
    all: unset;
    cursor: pointer;
    padding: 6px 14px;
    border-radius: var(--r-md);
    background: var(--ink);
    color: var(--bg-deep);
    font-weight: 600;
    font-size: 13px;
  }
  .signin:hover { background: var(--accent); color: var(--bg-deep); }

  /* Main */
  .main { overflow: auto; background: var(--bg); }

  /* Buttons */
  .btn {
    all: unset;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    font-size: 12.5px;
    cursor: pointer;
    color: var(--ink-soft);
    background: transparent;
    transition: all 0.08s;
    font-family: var(--font-sans);
    font-weight: 500;
  }
  .btn:hover { border-color: var(--ink-mute); color: var(--ink); }
  .btn-primary {
    background: var(--accent);
    color: var(--bg-deep);
    border-color: var(--accent);
    font-weight: 600;
  }
  .btn-primary:hover {
    background: oklch(0.78 0.19 38);
    border-color: oklch(0.78 0.19 38);
    color: var(--bg-deep);
  }
  .btn-ghost {
    border-color: transparent;
    background: transparent;
  }
  .btn-ghost:hover { background: var(--bg-raise); color: var(--ink); }
  .btn-lg { padding: 10px 18px; font-size: 14px; }
  .btn .kbd {
    font-family: var(--font-mono);
    font-size: 10px;
    border: 1px solid currentColor;
    padding: 0 4px;
    border-radius: 3px;
    opacity: 0.6;
  }

  /* Panels */
  .panel {
    background: var(--bg-deep);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
  }
  .panel-head {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .panel-title {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }

  /* Page header */
  .page-head {
    padding: 28px 32px 20px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
  }
  .page-head h1 {
    font-family: var(--font-disp);
    font-weight: 600;
    font-size: 38px;
    letter-spacing: -0.02em;
    line-height: 1.05;
  }
  .page-head .sub {
    color: var(--ink-mute);
    margin-top: 6px;
    font-size: 13px;
    font-family: var(--font-mono);
  }
  .page-head .actions { display: flex; gap: 8px; align-items: center; }
  .page-body { padding: 0 32px 80px; }

  /* Tags */
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 1px 6px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-radius: 2px;
    background: var(--bg-raise);
    color: var(--ink-soft);
    border: 1px solid var(--line);
    line-height: 1.4;
  }
  .tag.fi { color: var(--fi); border-color: oklch(from var(--fi) l c h / 0.4); background: oklch(from var(--fi) l c h / 0.1); }
  .tag.et { color: var(--et); border-color: oklch(from var(--et) l c h / 0.4); background: oklch(from var(--et) l c h / 0.1); }
  .tag.new { color: var(--new); border-color: oklch(from var(--new) l c h / 0.4); background: oklch(from var(--new) l c h / 0.08); }
  .tag.known { color: var(--known); border-color: oklch(from var(--known) l c h / 0.4); background: oklch(from var(--known) l c h / 0.08); }
  .tag.learning { color: var(--learning); border-color: oklch(from var(--learning) l c h / 0.4); background: oklch(from var(--learning) l c h / 0.08); }
  .tag.mwe { color: var(--accent); border-color: oklch(from var(--accent) l c h / 0.4); background: oklch(from var(--accent) l c h / 0.08); }

  .form-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 8px 3px 7px;
    border: 1px solid var(--line);
    border-radius: 3px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 500;
    color: var(--ink-soft);
    background: var(--bg);
    cursor: pointer;
    transition: border-color 0.12s, color 0.12s;
  }
  .form-pill:hover { border-color: var(--ink-mute); color: var(--ink); }
  .form-pill .form-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ink-mute);
    flex: none;
  }
  .form-pill.known       { color: var(--known);    border-color: oklch(from var(--known) l c h / 0.4);    background: oklch(from var(--known) l c h / 0.08); }
  .form-pill.known .form-dot    { background: var(--known); }
  .form-pill.learning    { color: var(--learning); border-color: oklch(from var(--learning) l c h / 0.4); background: oklch(from var(--learning) l c h / 0.08); }
  .form-pill.learning .form-dot { background: var(--learning); }
  .form-pill.new         { color: var(--new);      border-color: oklch(from var(--new) l c h / 0.4);      background: oklch(from var(--new) l c h / 0.06); }
  .form-pill.new .form-dot      { background: var(--new); }
  .form-pill.more {
    color: var(--ink-mute);
    border-style: dashed;
    background: transparent;
    padding-left: 8px;
  }
  .tag.pro {
    color: var(--bg-deep);
    background: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }

  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-mute); flex: none; }
  .dot.new { background: var(--new); }
  .dot.known { background: var(--known); }
  .dot.learning { background: var(--learning); }

  /* Tables */
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .data-table thead th {
    text-align: left;
    padding: 8px 12px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-mute);
    font-weight: 500;
    border-bottom: 1px solid var(--line);
    background: var(--bg-deep);
    position: sticky;
    top: 0;
    z-index: 1;
  }
  .data-table tbody td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line-soft);
    vertical-align: middle;
  }
  .data-table tbody tr { cursor: pointer; }
  .data-table tbody tr:hover { background: var(--bg-raise); }
  .data-table tbody tr.selected { background: oklch(from var(--accent) l c h / 0.10); }
  .data-table tbody tr.selected td:first-child { box-shadow: inset 2px 0 0 var(--accent); }

  /* Highlight in source */
  .hl {
    background: oklch(from var(--accent) l c h / 0.16);
    color: var(--accent);
    border-radius: 2px;
    padding: 0 2px;
  }
  .hl.known { background: oklch(from var(--known) l c h / 0.16); color: var(--known); }
  .hl.learning { background: oklch(from var(--learning) l c h / 0.16); color: var(--learning); }
  .hl.mwe { background: oklch(from var(--accent) l c h / 0.16); color: var(--accent); }

  .row { display: flex; align-items: center; gap: 8px; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .grow { flex: 1; min-width: 0; }

  /* ─── LANDING PASTE BOX ─── */
  .landing-wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 64px 32px 80px;
  }
  .hero-eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-mute);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .hero-eyebrow .pulse {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--known);
    border-radius: 50%;
    margin-right: 8px;
    box-shadow: 0 0 0 0 var(--known);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 oklch(from var(--known) l c h / 0.5); }
    50% { box-shadow: 0 0 0 6px oklch(from var(--known) l c h / 0); }
  }
  .hero-h {
    font-family: var(--font-disp);
    font-size: 64px;
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1.0;
    margin-bottom: 18px;
  }
  .hero-h em {
    font-style: italic;
    color: var(--accent);
    font-weight: 500;
  }
  .hero-sub {
    font-size: 17px;
    color: var(--ink-soft);
    max-width: 560px;
    line-height: 1.5;
    margin-bottom: 32px;
  }

  .paste-box {
    position: relative;
    background: var(--bg-deep);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    transition: border-color 0.15s;
    display: flex;
    flex-direction: column;
  }
  .paste-box.focused { border-color: var(--accent); }
  .paste-box textarea {
    all: unset;
    width: 100%;
    min-height: 240px;
    max-height: 420px;
    overflow-y: auto;
    padding: 24px 28px;
    font-family: var(--font-disp);
    font-size: 19px;
    line-height: 1.6;
    color: var(--ink);
    box-sizing: border-box;
    display: block;
    resize: vertical;
  }
  .paste-box textarea::placeholder { color: var(--ink-mute); font-style: italic; }
  .paste-foot {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px 12px;
    border-top: 1px solid var(--line);
    background: var(--bg-deep);
    border-radius: 0 0 var(--r-md) var(--r-md);
  }
  .paste-foot > * { pointer-events: auto; }
  .paste-foot .meter {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-mute);
  }
  .paste-foot .meter b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
  .lang-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 8px;
    border-radius: 2px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  .lang-badge.fi { background: oklch(from var(--fi) l c h / 0.12); color: var(--fi); border: 1px solid oklch(from var(--fi) l c h / 0.4); }
  .lang-badge.et { background: oklch(from var(--et) l c h / 0.12); color: var(--et); border: 1px solid oklch(from var(--et) l c h / 0.4); }
  .lang-badge.un { background: var(--bg-raise); color: var(--ink-mute); border: 1px solid var(--line); }
  .lang-badge .glyph { font-style: italic; font-family: var(--font-disp); font-weight: 600; font-size: 13px; line-height: 1; }

  .demo-chips {
    margin-top: 14px;
    display: flex;
    gap: 8px;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--ink-mute);
    flex-wrap: wrap;
  }
  .demo-chip {
    all: unset;
    cursor: pointer;
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--ink-soft);
    transition: all 0.08s;
    font-size: 11px;
  }
  .demo-chip:hover { border-color: var(--ink-mute); color: var(--ink); }

  .freemium-strip {
    margin-top: 56px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .freemium-cell {
    padding: 20px 24px 22px;
  }
  .freemium-cell + .freemium-cell { border-left: 1px solid var(--line); }
  .freemium-num {
    font-family: var(--font-disp);
    font-size: 22px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 4px;
    font-feature-settings: "tnum";
  }
  .freemium-h {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .freemium-p {
    font-size: 12.5px;
    color: var(--ink-mute);
    line-height: 1.5;
  }

  /* ─── Inspector popover ─── */
  .popover-mask {
    position: fixed;
    inset: 0;
    background: oklch(0.10 0.008 250 / 0.5);
    backdrop-filter: blur(2px);
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
  }
  .popover-mask.open { opacity: 1; pointer-events: auto; }
  .popover {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 440px;
    background: var(--bg);
    border-left: 1px solid var(--line);
    z-index: 60;
    transform: translateX(100%);
    transition: transform 0.2s ease;
    overflow: auto;
    box-shadow: -16px 0 32px oklch(0 0 0 / 0.3);
  }
  .popover.open { transform: translateX(0); }

  /* ─── Modal ─── */
  .modal-mask {
    position: fixed;
    inset: 0;
    background: oklch(0.10 0.008 250 / 0.6);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .modal {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    width: 100%;
    max-width: 440px;
    box-shadow: 0 32px 64px oklch(0 0 0 / 0.5);
    overflow: hidden;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--bg-deep);
    padding: 8px 16px;
    border-radius: var(--r-md);
    font-family: var(--font-mono);
    font-size: 12px;
    z-index: 200;
    box-shadow: 0 8px 24px oklch(0 0 0 / 0.3);
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  .loader { padding: 80px; text-align: center; color: var(--ink-mute); font-family: var(--font-mono); font-size: 12px; }
</style>
</head>
<body>
<div id="root">
  <div class="loader">↳ booting parser…</div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
