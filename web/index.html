<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinEstDB - Learn Finnish & Estonian</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Parse Input Page -->
    <div id="parse-page" class="page active">
        <header class="app-header">
            <div class="header-content">
                <h1 class="logo">FinEstDB</h1>
                <div class="header-actions">
                    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                        <span class="theme-icon">🌙</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="parse-main">
            <section class="parse-form-section">
                <h2>Parse Text</h2>
                <p class="parse-description">Paste Finnish or Estonian text to extract a word list.</p>

                <form id="parse-form">
                    <div class="form-group">
                        <label for="parse-lang">Language</label>
                        <select id="parse-lang" name="lang" required>
                            <option value="FI">Finnish (FI)</option>
                            <option value="ET">Estonian (ET)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="parse-text">Text <span id="char-count" class="char-count">0 / 10,000</span></label>
                        <textarea
                            id="parse-text"
                            name="text"
                            rows="12"
                            maxlength="10000"
                            placeholder="Paste your Finnish or Estonian text here..."
                            required
                        ></textarea>
                    </div>

                    <div id="lang-warning" class="lang-warning hidden"></div>

                    <div class="form-group">
                        <label for="parse-file">Or load from file (.txt, .md)</label>
                        <input type="file" id="parse-file" accept=".txt,.md">
                    </div>

                    <button type="submit" class="btn btn-primary btn-large" id="parse-btn">Parse Text</button>
                </form>
            </section>
        </main>
    </div>

    <!-- Results Page -->
    <div id="results-page" class="page">
        <header class="app-header">
            <div class="header-content">
                <button id="results-back" class="btn btn-link">← Parse New Text</button>
                <h1 class="logo">FinEstDB</h1>
                <div class="header-actions">
                    <button id="results-theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                        <span class="theme-icon">🌙</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="results-main">
            <section class="results-summary">
                <h2 id="results-title">Results</h2>
                <p id="results-stats" class="results-stats"></p>
            </section>

            <section class="results-table-section">
                <table class="word-table" id="word-table">
                    <thead>
                        <tr>
                            <th>Lemma</th>
                            <th>Part of Speech</th>
                            <th>Forms in Text</th>
                            <th class="col-count">Count</th>
                        </tr>
                    </thead>
                    <tbody id="word-table-body">
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
