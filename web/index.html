<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinEstDB - Learn Finnish & Estonian</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Global Navigation -->
    <nav class="global-nav">
        <div class="nav-content">
            <a href="#" class="nav-logo" id="nav-logo">FinEstDB</a>
            <div class="nav-links">
                <a href="#" class="nav-link disabled" title="Coming soon">Dashboard</a>
                <a href="#" class="nav-link active" id="nav-import">Import</a>
                <a href="#" class="nav-link disabled" title="Coming soon">Catalog</a>
                <a href="#" class="nav-link disabled" title="Coming soon">Review</a>
            </div>
            <div class="nav-actions">
                <button class="nav-icon-btn disabled" title="Settings (coming soon)" aria-label="Settings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
                    </svg>
                </button>
                <button id="theme-toggle" class="nav-icon-btn" aria-label="Toggle theme">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>
            <button class="nav-hamburger" id="nav-hamburger" aria-label="Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- Mobile nav overlay -->
    <div class="nav-mobile-overlay hidden" id="nav-mobile-overlay">
        <div class="nav-mobile-menu">
            <a href="#" class="nav-mobile-link disabled">Dashboard</a>
            <a href="#" class="nav-mobile-link active" id="nav-mobile-import">Import</a>
            <a href="#" class="nav-mobile-link disabled">Catalog</a>
            <a href="#" class="nav-mobile-link disabled">Review</a>
            <a href="#" class="nav-mobile-link disabled">Settings</a>
        </div>
    </div>

    <!-- Parse Input Page -->
    <div id="parse-page" class="page active">
        <main class="parse-main">
            <section class="parse-form-section">
                <h2>Parse Text</h2>
                <p class="parse-description">Paste Finnish or Estonian text to extract a word list.</p>

                <form id="parse-form">
                    <div class="form-group">
                        <label for="parse-lang">Language</label>
                        <select id="parse-lang" name="lang" required>
                            <option value="FI">Finnish (FI)</option>
                            <option value="ET">Estonian (ET)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="parse-text">Text <span id="char-count" class="char-count">0 / 300,000</span></label>
                        <textarea
                            id="parse-text"
                            name="text"
                            rows="12"
                            maxlength="300000"
                            placeholder="Paste your Finnish or Estonian text here..."
                            required
                        ></textarea>
                    </div>

                    <div id="lang-warning" class="lang-warning hidden" role="status" aria-live="polite"></div>
                    <button type="button" id="lang-switch-btn" class="lang-switch-btn hidden"></button>

                    <div class="form-group">
                        <label for="parse-file">Or load from file (.txt, .md)</label>
                        <input type="file" id="parse-file" accept=".txt,.md">
                    </div>

                    <div class="parse-buttons">
                        <button type="submit" class="btn btn-primary btn-parse" id="parse-btn-custom" data-parser="custom">
                            Custom Parser
                            <span class="parser-hint">Recommended — includes compound + case analysis</span>
                        </button>
                        <button type="submit" class="btn btn-outline btn-parse" id="parse-btn-basic" data-parser="basic">
                            Basic Parser
                            <span class="parser-hint">Dictionary lookup only</span>
                        </button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <!-- Results Page -->
    <div id="results-page" class="page">
        <main class="results-main">
            <section class="results-summary">
                <div class="results-header">
                    <button id="results-back" class="btn btn-link">← Back</button>
                    <h2 id="results-title">Results</h2>
                </div>
                <div id="results-meta" class="results-meta">
                    <span id="results-parser" class="results-pill"></span>
                    <div id="results-coverage" class="coverage-gauge">
                        <span class="coverage-gauge-label">Coverage</span>
                        <div class="coverage-gauge-bar">
                            <div id="coverage-fill" class="coverage-gauge-fill high" style="width: 0%"></div>
                        </div>
                        <span id="coverage-value" class="coverage-gauge-value">0%</span>
                    </div>
                    <span id="results-duration" class="results-pill"></span>
                </div>
                <p id="results-stats" class="results-stats"></p>
                <p id="results-help" class="results-help"></p>
            </section>

            <section class="results-table-section">
                <div id="pos-filter-bar" class="pos-filter-bar">
                    <button type="button" class="pos-filter-chip active" data-filter="all">All</button>
                    <button type="button" class="pos-filter-chip" data-filter="NOUN">Nouns</button>
                    <button type="button" class="pos-filter-chip" data-filter="VERB">Verbs</button>
                    <button type="button" class="pos-filter-chip" data-filter="ADJ">Adjectives</button>
                    <button type="button" class="pos-filter-chip" data-filter="ADV">Adverbs</button>
                    <button type="button" class="pos-filter-chip" data-filter="other">Other</button>
                </div>
                <table class="word-table" id="word-table">
                    <thead>
                        <tr>
                            <th class="col-row"><button type="button" class="sort-btn" data-sort="row">#<span class="sort-arrow" aria-hidden="true"></span></button></th>
                            <th><button type="button" class="sort-btn" data-sort="lemma">Lemma<span class="sort-arrow" aria-hidden="true"></span></button></th>
                            <th><button type="button" class="sort-btn" data-sort="pos">POS<span class="sort-arrow" aria-hidden="true"></span></button></th>
                            <th><button type="button" class="sort-btn" data-sort="forms">Forms<span class="sort-arrow" aria-hidden="true"></span></button></th>
                            <th class="col-def"><button type="button" class="sort-btn" data-sort="definition">Definition<span class="sort-arrow" aria-hidden="true"></span></button></th>
                            <th class="col-count"><button type="button" class="sort-btn" data-sort="tokens">Tokens<span class="sort-arrow" aria-hidden="true"></span></button></th>
                        </tr>
                    </thead>
                    <tbody id="word-table-body">
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script type="module" src="app.js"></script>
</body>
</html>
