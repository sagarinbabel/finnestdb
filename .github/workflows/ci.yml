name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs of the same branch when a new commit lands so
# we don't waste minutes on stale revisions.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Go unit tests ────────────────────────────────────────────────────────
  # Covers internal/api, internal/store, and every other internal package.
  # cmd/server's tests would require the full dictionary import, so they
  # stay out of CI; the same applies to anything that needs finnestdb.db.
  unit-tests:
    name: Unit tests (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
          cache: true

      # internal/parserffi is cgo-linked against the Rust parser. Even tests
      # in packages that only import parserffi transitively need the static
      # library on disk before `go test` will compile them.
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: parser/target
          key: cargo-${{ runner.os }}-${{ hashFiles('parser/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build Rust parser
        run: cd parser && cargo build --release

      - name: Run Go tests
        # libparser.so is a Rust cdylib; cgo links against -lparser at build
        # time but the dynamic loader needs it on LD_LIBRARY_PATH to find
        # the shared object at runtime. On macOS the binary picks up
        # libparser.dylib via the build directory path automatically.
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/parser/target/release
        run: go test ./internal/...

  # ── Lint ─────────────────────────────────────────────────────────────────
  # Static analysis only - no test execution. Fast feedback for obvious
  # mistakes. `go vet` for Go (skipping the cgo package which would need
  # the Rust build), `tsc --noEmit` for the TypeScript frontend.
  lint:
    name: Lint (Go + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
          cache: true

      - name: go vet
        # parserffi requires cgo + the Rust static library, so skip it here
        # to keep the lint job fast (no Rust toolchain installed). Packages
        # that import parserffi still vet fine without the C lib because
        # vet works at the Go source level. Unit-tests covers parserffi.
        run: go list ./internal/... | grep -v '/parserffi' | xargs go vet

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: TypeScript type-check
        working-directory: web
        run: npx tsc --noEmit -p tsconfig.json

  # ── Playwright ───────────────────────────────────────────────────────────
  # End-to-end browser tests. Boots the Go server via playwright's
  # webServer config - requires the Rust parser to be built first.
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: parser/target
          key: cargo-${{ runner.os }}-${{ hashFiles('parser/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build Rust parser
        run: cd parser && cargo build --release

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      # The browser binary cache key is bumped whenever package-lock.json
      # changes, so a Playwright version bump triggers a fresh install.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        # Playwright spawns `go run ./cmd/server` via webServer config; the
        # spawned process inherits this env, so libparser.so is locatable
        # at runtime. See the unit-tests job for the same workaround.
        working-directory: web
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/parser/target/release
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
